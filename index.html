<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Food World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23fff3e0'/><path d='M30 62c8-24 32-24 40 0z' fill='%23c9413f'/><circle cx='50' cy='38' r='8' fill='%23e0a52c'/></svg>" />
  </head>
  <body class="fw">
    <div id="app">
      <canvas id="stage" aria-label="Food World"></canvas>
      <div id="labels"></div>
      <nav id="crumbs" hidden></nav>
      <div id="hint" hidden></div>
      <aside id="card" hidden></aside>
      <section id="recipe" hidden></section>
      <div id="fade"></div>
      <div id="home">
        <div class="home-inner">
          <p class="eyebrow">Food World</p>
          <h1>Explore the world<br/>through food.</h1>
          <p class="lede">A miniature world containing the food I love and know how to cook.</p>
          <button id="enter" class="enter">Enter the world →</button>
          <p class="fine" id="home-status">Waking the villages…</p>
        </div>
      </div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="/src/fw/main.ts"></script>
  </body>
</html>
