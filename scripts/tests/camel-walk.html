<!doctype html><html><head><title>Camel walk review</title><style>body{margin:0;background:#e3c995;font:14px sans-serif}nav{position:absolute;top:16px;left:20px}button{padding:8px}canvas{display:block}</style></head><body><nav><button id="pause">Pause</button> <button id="step">Next pose</button> <span id="time"></span></nav><script type="module">
import * as THREE from 'three';
import {camelWalker} from '/src/fw/props-xinjiang.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e3c995');scene.add(new THREE.HemisphereLight(0xffffff,0xa88853,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(4,8,6);scene.add(light);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(3.5,3.5,7);camera.lookAt(0,.9,0);
const camel=camelWalker();scene.add(camel);
const grid=new THREE.GridHelper(12,24,0x99835d,0xc6ab79);grid.position.y=-.01;scene.add(grid);
let t=0,last=performance.now(),paused=false;document.querySelector('#pause').onclick=()=>{paused=!paused};document.querySelector('#step').onclick=()=>{paused=true;t+=.4};
function frame(now){if(!paused)t+=Math.min(.05,(now-last)/1000);last=now;camel.userData.walk(t);grid.position.x=-(t*.26)% .5;document.querySelector('#time').textContent=`Cycle ${(t%3.2).toFixed(2)}s / 3.20s`;renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
