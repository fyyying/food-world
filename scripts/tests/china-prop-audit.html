<!doctype html><html><head><title>China prop support audit</title><style>body{margin:0;background:#e4dbc6;font:14px system-ui}nav{height:35px;display:flex;gap:12px;align-items:center}main{display:grid;grid-template-columns:1fr 1fr}.view{height:390px;position:relative}.label{position:absolute;top:8px;left:12px}canvas{display:block;width:100%;height:100%}</style></head><body><nav><button id="prev">Previous</button><button id="next">Next</button><button id="reverse">Reverse view</button><span id="page"></span></nav><main></main><script type="module">
import * as THREE from 'three';
import {PROPS} from '/src/fw/props.ts';
import {JN_PROPS} from '/src/fw/props-jiangnan.ts';
import {NORTH_PROPS} from '/src/fw/props-north.ts';
import {XJ_PROPS} from '/src/fw/props-xinjiang.ts';
const factories={...PROPS,...JN_PROPS,...NORTH_PROPS,...XJ_PROPS};
const params=new URLSearchParams(location.search), ids=params.has('ids')?params.get('ids').split(','):Object.keys(factories).filter(id=>id!=='none');
let page=Number(params.get('page')||0),reverse=false,views=[];
function show(){for(const v of views){v.renderer.dispose();v.scene.traverse(o=>{o.geometry?.dispose();if(o.material){for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose()}})}views=[];document.querySelector('main').replaceChildren();document.querySelector('#page').textContent=`${page+1}/${Math.ceil(ids.length/4)} · ${ids.length} China props`;
for(const id of ids.slice(page*4,page*4+4)){
 const host=document.createElement('div');host.className='view';host.innerHTML=`<span class="label">${id}</span>`;document.querySelector('main').append(host);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(host.clientWidth,host.clientHeight);host.append(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#e4dbc6');scene.add(new THREE.HemisphereLight(0xffffff,0x8a7958,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(5,10,8);scene.add(sun);
 const prop=factories[id]();scene.add(prop);const bounds=new THREE.Box3().setFromObject(prop),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
 const radius=Math.max(size.x,size.y,size.z)*.8;const camera=new THREE.PerspectiveCamera(36,host.clientWidth/host.clientHeight,.1,300);camera.position.copy(center).add(new THREE.Vector3(reverse?-1:1,.9,reverse?-1.3:1.3).normalize().multiplyScalar(radius*3.2));camera.lookAt(center);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(radius*3,radius*3),new THREE.MeshStandardMaterial({color:'#b0bd86'}));ground.rotation.x=-Math.PI/2;ground.position.y=Math.min(0,bounds.min.y)-.02;scene.add(ground);views.push({renderer,scene,camera,prop});
}}
document.querySelector('#next').onclick=()=>{page=Math.min(Math.ceil(ids.length/4)-1,page+1);show()};document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);show()};document.querySelector('#reverse').onclick=()=>{reverse=!reverse;show()};show();
let last=0;function frame(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;for(const v of views){v.prop.userData.tick?.(ms/1000,dt);v.renderer.render(v.scene,v.camera)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
