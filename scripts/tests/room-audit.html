<!doctype html><html><head><title>Live room audit</title><style>
body{margin:8px;background:#eee2cc;font:14px system-ui}nav{display:flex;gap:12px;height:32px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}h2{font-size:16px;margin:4px}.views{display:flex;gap:8px;flex-direction:column;align-items:center}.wide{width:100%;aspect-ratio:16/9}.phone{width:35%;aspect-ratio:9/17}iframe{border:0;width:100%;height:100%}
</style></head><body><nav><button id="prev">Previous</button><button id="next">Next</button><span id="page"></span></nav><main></main><script type="module">
import {SCENES} from '/src/fw/scenes-china.ts';
const ids=Object.keys(SCENES);let page=Number(new URLSearchParams(location.search).get('page')||0);
function show(){document.querySelector('#page').textContent=`${page+1} / ${Math.ceil(ids.length/2)}`;document.querySelector('main').innerHTML=ids.slice(page*2,page*2+2).map(id=>`<article><h2>${id}</h2><div class="views"><div class="wide"><iframe title="${id} wide" src="rooms.html?audit&room=${id}"></iframe></div><div class="phone"><iframe title="${id} phone" src="rooms.html?audit&room=${id}"></iframe></div></div></article>`).join('');}
document.querySelector('#next').onclick=()=>{page=Math.min(Math.ceil(ids.length/2)-1,page+1);show()};document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);show()};show();
</script></body></html>
