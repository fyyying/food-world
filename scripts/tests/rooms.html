<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room interaction checks</title></head><body><div id="app"></div><script type="module">
import '/src/fw/style.css';
import { SCENES as CHINA_SCENES } from '/src/fw/scenes-china.ts';
import { TURKEY_SCENES } from '/src/fw/scenes-turkey.ts';
import { SPAIN_SCENES } from '/src/fw/scenes-spain.ts';
import { THAILAND_SCENES } from '/src/fw/scenes-thailand.ts';
import { VIETNAM_SCENES } from '/src/fw/scenes-vietnam.ts';
const SCENES = { ...CHINA_SCENES, ...TURKEY_SCENES, ...SPAIN_SCENES, ...THAILAND_SCENES, ...VIETNAM_SCENES };
import { openLivingScene } from '/src/fw/scene.ts';
const picker = document.createElement('select');
picker.setAttribute('aria-label', 'Room');
picker.style.cssText = 'position:fixed;top:12px;left:50%;z-index:10000';
for (const id of Object.keys(SCENES)) picker.add(new Option(id, id));
document.body.append(picker);
let room;
const phone = new URLSearchParams(location.search).has('portrait');
if(new URLSearchParams(location.search).has('audit')) {const style=document.createElement('style');style.textContent='.scene-ui,body > select{display:none !important}';document.head.append(style);}
if(phone) {const style=document.createElement('style');style.textContent='#scene{width:390px;height:740px;left:calc(50% - 195px);top:60px} #scene .scene-title{left:16px;bottom:18px;max-width:358px} #scene .scene-title .zh{font-size:30px} #scene .scene-title h2{font-size:26px} #scene .scene-title p{font-size:12px}';document.head.append(style);}
function show() { room?.destroy(); room = openLivingScene(SCENES[picker.value](), { dishes: [], onDish() {}, onStory() {}, onClose() { room?.destroy(); } }); }
picker.onchange = show;
picker.value = new URLSearchParams(location.search).get('room') || 'teahouse'; show();
// Inspect production effect keyframes against the painting in either orientation.
if (new URLSearchParams(location.search).has('motion')) {
  const controls = document.createElement('nav');
  controls.style.cssText = 'position:fixed;bottom:8px;right:8px;z-index:10001;display:flex;gap:6px';
  for (const fraction of [.25,.5,.75]) {
    const button = document.createElement('button'); button.textContent = `Inspect ${fraction*100}%`;
    button.onclick = () => document.querySelectorAll('.room-response-particle').forEach(node => node.getAnimations().forEach(animation => {
      const timing = animation.effect.getTiming(); animation.pause(); animation.currentTime = timing.delay + Number(timing.duration) * fraction;
    }));
    controls.append(button);
  }
  document.body.append(controls);
}
let last=performance.now();
function tick(now) { room?.tick(now/1000, Math.min(.05,(now-last)/1000)); last=now; requestAnimationFrame(tick); }
requestAnimationFrame(tick);
</script></body></html>
