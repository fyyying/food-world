<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Turkey world inspection</title><style>
body{margin:0;background:#eadfcb;font:14px system-ui}nav{display:flex;gap:12px;padding:10px;position:absolute;top:0;z-index:5;background:#fff9eae8;border-radius:0 0 12px 0}button,select{font:inherit;padding:6px}#view{width:100vw;height:100vh}#status{position:absolute;bottom:12px;left:12px;padding:8px;background:#fff9eae8;border-radius:8px}canvas{display:block}
</style></head><body><nav><label>Area <select id="area"><option value="all">Whole Middle East</option><option value="turkey">Turkey cluster</option><option value="istanbul">Istanbul</option><option value="aegean">Aegean</option><option value="anatolia">Anatolia</option><option value="blacksea-tr">Black Sea</option><option value="levant">Levant</option><option value="persia">Persia</option><option value="arabia">Arabia</option></select></label><button id="angle">Reverse view</button><button id="pause">Pause motion</button><label>Room <select id="room"><option value="">Choose a room</option></select></label></nav><div id="view"></div><output id="status">Loading the world…</output><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {buildMideast} from '/src/fw/world-mideast.ts';
import {AREAS} from '/src/fw/graph.ts';
import {TURKEY_SCENES} from '/src/fw/scenes-turkey.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.querySelector('#view').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#eadfcb');scene.add(new THREE.HemisphereLight('#fff6e7','#9e937b',2.2));const sun=new THREE.DirectionalLight('#fff1dc',3);sun.position.set(-30,65,35);scene.add(sun);
const world=buildMideast([]);scene.add(world.group);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,500),controls=new OrbitControls(camera,renderer.domElement);controls.maxPolarAngle=Math.PI*.48;let reverse=false,paused=false;
function show(){const key=document.querySelector('#area').value;const center=key==='all'?[0,0]:key==='turkey'?[-6,-23]:AREAS[key].center;const distance=key==='all'?180:key==='turkey'?91:42;controls.target.set(center[0],0,center[1]);camera.position.copy(controls.target).add(new THREE.Vector3(reverse?-distance*.30:distance*.15,distance*.85,reverse?-distance:distance));controls.update();}
document.querySelector('#area').onchange=show;document.querySelector('#angle').onclick=()=>{reverse=!reverse;show()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion'};
for(const [id,factory] of Object.entries(TURKEY_SCENES))document.querySelector('#room').add(new Option(factory().title,id));document.querySelector('#room').onchange=e=>{if(e.target.value)location.href='rooms.html?room='+e.target.value};
document.querySelector('#status').textContent=world.placed.filter(p=>p.obj.scene).length+' Turkish rooms · drag to inspect · scroll to zoom';show();
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});let last=0,time=0;function frame(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;if(!paused){time+=dt;world.tick(time,dt);}controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
